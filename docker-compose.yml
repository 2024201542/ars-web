version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ../academic-research-skills:/opt/academic-research-skills:ro
    environment:
      - ARS_WEB_SECRET_KEY=${ARS_WEB_SECRET_KEY}
      - ARS_WEB_DB_PATH=/app/backend/data/ars.db
      - ARS_SKILLS_PATH=/opt/academic-research-skills
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
