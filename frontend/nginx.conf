# ARS Web nginx 配置
# 开发环境: vite proxy 自动转发 /api → localhost:8000
# 生产环境: 将此文件复制到 /etc/nginx/sites-available/

server {
    listen 80;
    server_name _;

    # 前端静态文件（生产构建后的 dist/ 目录）
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式输出: 必须禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Claude CLI proxy 端点
    location /v1/proxy/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
